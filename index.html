<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b35">
    <title>そらいろランナー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="topbar">
            <a class="brand" href="#" aria-label="そらいろランナー">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>そらいろランナー</span>
            </a>
            <p class="tagline">星を集めて、ゴールを目指そう！</p>
        </header>

        <section class="game-card" aria-label="ゲーム画面">
            <div class="hud" aria-live="polite">
                <div class="hud-item score-item" aria-label="スコア"><span class="hud-icon" aria-hidden="true">✦</span><span id="score">0</span><span class="hud-label"> / 8</span></div>
                <div class="hud-item hearts" id="lives" aria-label="残りライフ">♥ ♥ ♥</div>
                <button class="restart-button" id="restart" type="button">↻ <span>やり直す</span></button>
            </div>
            <div class="canvas-wrap">
                <canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム。左右キーで移動、スペースキーでジャンプ。">
                    このゲームを遊ぶには、Canvasに対応したブラウザーが必要です。
                </canvas>
                <div class="message" id="message" hidden>
                    <div class="message-card">
                        <span class="message-icon" id="message-icon" aria-hidden="true">🏁</span>
                        <h1 id="message-title">ゴール！</h1>
                        <p id="message-text"></p>
                        <button id="play-again" type="button">もう一度遊ぶ</button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="controls">
            <div class="key-hint">
                <span class="key-group"><kbd>←</kbd><kbd>→</kbd> 移動</span>
                <span class="key-group"><kbd>Space</kbd> ジャンプ</span>
                <span class="key-group"><kbd>R</kbd> やり直す</span>
            </div>
            <div class="touch-controls" aria-label="タッチ操作">
                <button class="touch-button" type="button" data-control="left" aria-label="左へ移動">←</button>
                <button class="touch-button" type="button" data-control="right" aria-label="右へ移動">→</button>
                <button class="touch-button jump-button" type="button" data-control="jump" aria-label="ジャンプ">ジャンプ</button>
            </div>
            <p class="tip">敵の上に乗ると倒せるよ。足場から落ちないように気をつけて！</p>
        </footer>
    </main>
    <script src="game.js"></script>
</body>
</html>
